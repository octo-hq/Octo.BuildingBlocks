name: Publicar Pacotes no GitHub Packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x" # Ajuste para a versão do .NET usada no Octo.Core
  SOLUTION_PATH: "Octo.BuildingBlocks.sln" # Ou o caminho do seu .sln / .csproj
  TEST_PROJECT_PATH: "tests/Octo.Core.UnitTests/Octo.Core.UnitTests.csproj"
  PACK_PROJECT_PATH: "src/Octo.Core/Octo.Core.csproj"  
  SONAR_PROJECT_KEY: "octo-hq_Octo.BuildingBlocks"
  SONAR_ORGANIZATION : "octo-hq"
  
jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 # Importante para histórico Git / análise precisa no SonarQube Cloud

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java (required for SonarScanner for .NET)
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Install SonarScanner for .NET
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Begin SonarQube Cloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"${{ env.SONAR_PROJECT_KEY }}" \
          /o:"${{ env.SONAR_ORGANIZATION }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.qualitygate.wait=true

    - name: Restaurar dependências
      run: dotnet restore

    - name: Build da Solution
      run: dotnet build "${{ env.SOLUTION_PATH }}" --no-restore --configuration Release

    - name: Run unit tests
      run: |
        dotnet test "${{ env.TEST_PROJECT_PATH }}" \
          --configuration Release \
          --no-build \
          --verbosity normal

    - name: End SonarQube Cloud analysis and wait for Quality Gate
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # O run_number incrementa automaticamente a cada execução (ex: 1.0.1, 1.0.2, 1.0.3...)
    - name: Pack NuGet package
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet pack --no-build --configuration Release --output "./nupkg" -p:Version=1.0.${{ github.run_number }}

    - name: Adicionar fonte do GitHub Packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        dotnet nuget add source \
          --username ${{ github.actor }} \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text \
          --name github \
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: Publicar todos os pacotes no GitHub Packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --source "github" \
          --skip-duplicate
